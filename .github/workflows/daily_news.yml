# GitHub Actionsワークフロー: AIニュースまとめ 自動生成・デプロイ
#
# 毎朝7:00（日本時間）に自動実行し、AIニュースを収集・翻訳して
# GitHub Pagesへ直接デプロイします。

name: AIニュースまとめ 自動更新

on:
  schedule:
    - cron: '0 22 * * *'  # 日本時間 翌朝 7:00
  workflow_dispatch:      # 手動実行ボタン

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.12 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージをインストール
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: AIニュースを取得・翻訳してHTMLを生成
        run: python scripts/fetch_news.py

      - name: 変更をコミット＆プッシュ（次回用の履歴保存）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/
          git diff --staged --quiet || git commit -m "📰 $(TZ=Asia/Tokyo date '+%Y/%m/%d %H:%M') のAIニュースまとめを更新"
          git push

      - name: Pages環境のセットアップ
        uses: actions/configure-pages@v5

      - name: 静的ページのアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: GitHub Pagesへ直接デプロイ
        id: deployment
        uses: actions/deploy-pages@v4
